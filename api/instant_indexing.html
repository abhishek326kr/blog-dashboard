<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Indexing Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Instant Indexing Dashboard</h2>
    <div class="mb-3">
        <label for="url" class="form-label">Enter URL to Check Indexing:</label>
        <input type="text" id="url" class="form-control" placeholder="https://example.com/page">
        <button id="checkIndex" class="btn btn-primary mt-2">Check Index Status</button>
    </div>

    <h3>Indexing Status</h3>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>URL</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="statusList">
        </tbody>
    </table>

    <div id="result" class="mt-3"></div>
</div>

<script>
document.getElementById("checkIndex").addEventListener("click", function() {
    let url = document.getElementById("url").value;
    if (url.trim() === "") {
        alert("Please enter a valid URL.");
        return;
    }
    
    fetch("instant_indexing.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "url=" + encodeURIComponent(url)
    })
    .then(response => response.json())
    .then(data => {
        let status = data.indexed ? "✅ Indexed" : "❌ Not Indexed";
        let row = `<tr><td>${data.url}</td><td>${status}</td></tr>`;
        document.getElementById("statusList").innerHTML += row;

        document.getElementById("result").innerHTML = `<pre>${JSON.stringify(data.details, null, 2)}</pre>`;
    })
    .catch(error => console.error("Error:", error));
});
</script>
</body>
</html>
